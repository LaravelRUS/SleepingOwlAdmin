name: Tests

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    no-build-consumer:
        name: No-build consumer
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: pdo_sqlite, sqlite3
                  coverage: none
                  tools: composer:v2

            - name: Install release artifact without Node.js
              run: bash scripts/ci/no-build-consumer-smoke.sh

    php:
        name: PHP
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: pdo_sqlite, sqlite3
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Run PHP tests
              run: composer test

    frontend:
        name: Frontend
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install frontend dependencies
              run: npm ci

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Run frontend checks
              run: npm run check:ci
