<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="/public/default/css/shared/ui.css" />
        <link rel="stylesheet" href="/public/default/css/shared/features.css" />
        <script>
            const theme = new URLSearchParams(location.search).get('theme') || 'shadcn'
            const supported = ['adminlte', 'shadcn']
            if (!supported.includes(theme)) throw new Error(`Unsupported fixture theme: ${theme}`)
            for (const href of [`/public/default/css/themes/${theme}.css`]) {
                const link = document.createElement('link')
                link.rel = 'stylesheet'
                link.href = href
                document.head.append(link)
            }
        </script>
    </head>
    <body class="soa-body sidebar-mini sidebar-open">
        <aside id="presented-sidebar" class="soa-sidebar app-sidebar main-sidebar">
            <ul class="sidebar-menu nav-sidebar soa-nav-tree">
                <li id="presented-item" class="nav-item soa-nav-item">
                    <a id="presented-link" class="nav-link soa-nav-link active" href="#active">
                        <span aria-hidden="true">&bull;</span>
                        <p class="soa-nav-link-content">
                            <span class="soa-nav-title">Active</span>
                            <i
                                id="presented-arrow"
                                class="nav-arrow soa-nav-arrow fas fa-angle-right"
                                aria-hidden="true"
                            ></i>
                        </p>
                    </a>
                    <ul class="nav-treeview soa-nav-children">
                        <li>Child</li>
                    </ul>
                </li>
            </ul>
        </aside>
    </body>
</html>
