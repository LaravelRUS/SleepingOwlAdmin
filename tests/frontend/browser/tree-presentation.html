<!doctype html>
<html lang="en" data-color-scheme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="/public/default/css/admin-core.css" />
        <link rel="stylesheet" href="/public/default/css/shared/ui.css" />
        <link rel="stylesheet" href="/public/default/css/shared/features.css" />
        <script>
            const theme = new URLSearchParams(location.search).get('theme') || 'adminlte'
            const supported = ['adminlte', 'tabler']
            if (!supported.includes(theme)) throw new Error(`Unsupported fixture theme: ${theme}`)

            for (const href of [`/public/default/css/themes/${theme}.css`]) {
                const link = document.createElement('link')
                link.rel = 'stylesheet'
                link.href = href
                document.head.append(link)
            }
        </script>
    </head>
    <body>
        <main class="soa-tree" data-tree>
            <ol class="soa-tree-list" data-tree-list data-tree-root>
                <li class="soa-tree-item" data-tree-item data-id="1">
                    <button class="soa-tree-toggle" data-tree-toggle type="button">
                        <span data-tree-toggle-expanded aria-hidden="true">−</span>
                        <span data-tree-toggle-collapsed aria-hidden="true" hidden>+</span>
                    </button>
                    <button class="soa-tree-handle" data-tree-handle type="button">≡</button>
                    <div class="soa-tree-content">Catalog</div>
                    <ol class="soa-tree-list" data-tree-list>
                        <li class="soa-tree-item" data-tree-item data-id="2">
                            <div class="soa-tree-content">Phones</div>
                        </li>
                    </ol>
                </li>
            </ol>
        </main>
    </body>
</html>
