<!doctype html>
<html lang="en" data-theme="shadcn" style="--soa-sidebar-bg: rgb(12, 34, 56)">
    <head>
        <meta charset="UTF-8" />
        <meta name="csrf-token" content="theme-capabilities-token" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Tailwind theme capability fixture</title>
        <script>
            window.GlobalConfig = {
                datatables_settings: { state_datatables: false, state_filters: false },
                debug: true,
                env: 'testing',
                lang: {
                    button: { cancel: 'Cancel', save: 'Save', yes: 'Yes' },
                    file: { insert_link: 'Insert link' },
                    select: { no_items: 'No items', nothing: 'Nothing selected' },
                    table: {
                        'delete-confirm': 'Delete?',
                        'destroy-confirm': 'Destroy?',
                        error: 'Table error',
                        'no-action': 'No action',
                    },
                },
                locale: 'en',
                state_tabs: false,
                template: { asset_dir: 'default' },
                url: 'http://127.0.0.1:4173',
                url_path: 'theme-capabilities-tailwind',
                url_prefix: 'admin',
                user_id: null,
                wysiwyg: {},
            }
        </script>
        <link rel="stylesheet" href="/public/default/profiles/development/css/admin-core.css" />
        <link rel="stylesheet" href="/public/default/profiles/development/css/icons.css" />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/themes/shadcn.css"
        />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/themes/shadcn-utilities.css"
        />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/features/dropdown.css"
        />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/features/dropdown/themes/shadcn.css"
        />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/features/sidebar.css"
        />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/features/sidebar/themes/shadcn.css"
        />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/features/lightbox.css"
        />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/features/lightbox/themes/shadcn.css"
        />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/features/table/themes/shadcn.css"
        />
        <link rel="stylesheet" href="/public/default/profiles/development/css/features/table.css" />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/features/tabs/themes/shadcn.css"
        />
        <link rel="stylesheet" href="/public/default/profiles/development/css/features/forms.css" />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/features/forms/themes/shadcn.css"
        />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/features/tooltip.css"
        />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/features/tooltip/themes/shadcn.css"
        />
        <link rel="stylesheet" href="/public/default/profiles/development/css/features/tree.css" />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/features/tree/themes/shadcn.css"
        />
    </head>
    <body class="soa-body sidebar-mini">
        <div class="app-wrapper soa-app">
            <header class="app-header soa-header">
                <button class="soa-button" data-mode="light" id="theme-mode" type="button">
                    <span aria-hidden="true" id="theme-icon"></span>
                    Toggle color mode
                </button>
                <button
                    class="soa-button"
                    data-widget="pushmenu"
                    id="capability-sidebar"
                    type="button"
                >
                    Toggle navigation
                </button>
            </header>

            <aside class="app-sidebar main-sidebar soa-sidebar" id="capability-sidebar-panel">
                <ul class="nav nav-sidebar soa-sidebar-nav" data-widget="treeview">
                    <li class="nav-item">
                        <a
                            class="nav-link soa-nav-link"
                            href="#capability-child"
                            id="capability-branch"
                            >Capabilities</a
                        >
                        <ul class="nav nav-treeview" id="capability-tree">
                            <li class="nav-item">
                                <a class="nav-link soa-nav-link" href="#capability-table">Table</a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </aside>
            <div id="sidebar-overlay" hidden></div>

            <main class="app-main soa-main">
                <section class="soa-card soa-card-body">
                    <div class="dropdown soa-dropdown">
                        <button
                            class="soa-button"
                            data-toggle="dropdown"
                            id="capability-dropdown"
                            type="button"
                        >
                            Actions
                        </button>
                        <div class="dropdown-menu soa-dropdown-menu">
                            <button class="dropdown-item soa-dropdown-item" type="button">
                                Archive
                            </button>
                        </div>
                    </div>

                    <button
                        class="soa-button"
                        data-toggle="tooltip"
                        id="capability-tooltip"
                        title="Theme help"
                        type="button"
                    >
                        Help
                    </button>

                    <div class="soa-tabs" data-tablist>
                        <button
                            class="soa-tab active"
                            data-tab
                            id="capability-first-tab"
                            aria-controls="capability-first-panel"
                        >
                            Overview
                        </button>
                        <button
                            class="soa-tab"
                            data-tab
                            id="capability-second-tab"
                            aria-controls="capability-second-panel"
                        >
                            Details
                        </button>
                    </div>
                    <section id="capability-first-panel">Overview panel</section>
                    <section id="capability-second-panel">Details panel</section>

                    <table
                        class="table datatables soa-table"
                        data-attributes='{"order":[],"paging":false,"searching":false}'
                        data-id="capability-table"
                        id="capability-table"
                    >
                        <thead>
                            <tr>
                                <th>Name</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Shared row</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="alert soa-alert show" id="capability-alert">
                        Saved
                        <button data-dismiss="alert" id="capability-alert-close" type="button">
                            Close
                        </button>
                    </div>
                </section>
            </main>
        </div>

        <template data-tooltip-template>
            <aside class="soa-tooltip" data-tooltip-popup role="tooltip">
                <strong data-tooltip-content></strong>
            </aside>
        </template>

        <script src="/public/default/profiles/development/js/admin-core.js"></script>
        <script src="/public/default/profiles/development/js/shared/compatibility.js"></script>
        <script src="/public/default/profiles/development/js/shared/vue.js"></script>
        <script src="/public/default/profiles/development/js/themes/shadcn.js"></script>
        <script src="/public/default/profiles/development/js/features/alert.js"></script>
        <script src="/public/default/profiles/development/js/features/tooltip.js"></script>
        <script src="/public/default/profiles/development/js/features/dropdown.js"></script>
        <script src="/public/default/profiles/development/js/features/sidebar.js"></script>
        <script src="/public/default/profiles/development/js/features/lightbox.js"></script>
        <script src="/public/default/profiles/development/js/features/table.js"></script>
        <script src="/public/default/profiles/development/js/features/tabs.js"></script>
        <script src="/public/default/profiles/development/js/features/forms.js"></script>
        <script src="/public/default/profiles/development/js/features/tree.js"></script>
        <script src="/public/default/profiles/development/js/features/tree/themes/shadcn.js"></script>
        <script src="/public/default/profiles/development/js/shared/modules.js"></script>
    </body>
</html>
