<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="csrf-token" content="adminlte-logical-token" />
        <title>AdminLTE logical runtime fixture</title>
        <script>
            window.GlobalConfig = {
                datetime_format: 'DD.MM.YYYY HH:mm',
                date_format: 'DD.MM.YYYY',
                debug: true,
                env: 'testing',
                lang: {
                    button: { cancel: 'Cancel', save: 'Save', yes: 'Yes' },
                    ckeditor: { upload: { error: { common: 'Upload error' } } },
                    file: { insert_link: 'Insert link' },
                    select: { no_items: 'No items', nothing: 'Nothing selected' },
                    table: {
                        'delete-confirm': 'Delete?',
                        'destroy-confirm': 'Destroy?',
                        error: 'Table error',
                        'no-action': 'No action',
                    },
                    tree: {
                        collapse: 'Collapse all',
                        expand: 'Expand all',
                        reorderCompleted: 'Item moved',
                    },
                },
                locale: 'en',
                datatables_settings: {
                    state_datatables: false,
                    state_filters: false,
                    datatables_highlight: false,
                },
                state_tabs: false,
                template: { asset_dir: 'default' },
                url: 'http://127.0.0.1:4173',
                url_path: 'adminlte-logical-runtime',
                url_prefix: 'admin',
                user_id: null,
                wysiwyg: {},
            }
        </script>
    </head>
    <body>
        <div class="alert show" id="runtime-alert">
            Runtime alert
            <button data-dismiss="alert" id="runtime-alert-close" type="button">Close</button>
        </div>

        <div class="dropdown" id="runtime-dropdown">
            <button data-toggle="dropdown" id="runtime-dropdown-toggle" type="button">Menu</button>
            <div class="dropdown-menu">
                <button class="dropdown-item" type="button">Action</button>
            </div>
        </div>

        <button data-toggle="tooltip" id="runtime-tooltip" title="Runtime help" type="button">
            Help
        </button>

        <table
            class="datatables"
            data-attributes='{"order":[],"paging":false,"searching":false}'
            data-id="runtime-table"
            id="runtime-table"
        >
            <thead>
                <tr>
                    <th>Name</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Logical row</td>
                </tr>
            </tbody>
        </table>

        <section data-reorderable="false" data-tree data-url="/api/tree/reorder" id="runtime-tree">
            <ol data-tree-list data-tree-root>
                <li data-id="1" data-tree-item>Root</li>
            </ol>
        </section>

        <script src="/public/default/profiles/development/js/admin-core.js"></script>
        <script src="/public/default/profiles/development/js/shared/compatibility.js"></script>
        <script src="/public/default/profiles/development/js/shared/vue.js"></script>
        <script src="/public/default/profiles/development/js/themes/legacy-adminlte.js"></script>
        <script src="/public/default/profiles/development/js/features/alert.js"></script>
        <script src="/public/default/profiles/development/js/features/tooltip.js"></script>
        <script src="/public/default/profiles/development/js/features/dropdown.js"></script>
        <script src="/public/default/profiles/development/js/features/sidebar.js"></script>
        <script src="/public/default/profiles/development/js/features/lightbox.js"></script>
        <script src="/public/default/profiles/development/js/features/table.js"></script>
        <script src="/public/default/profiles/development/js/features/tabs.js"></script>
        <script src="/public/default/profiles/development/js/features/forms.js"></script>
        <script src="/public/default/profiles/development/js/features/tree.js"></script>
        <script src="/public/default/profiles/development/js/features/tree/themes/legacy-adminlte.js"></script>
        <script>
            window.__customModuleBoots = 0
            Admin.Modules.register('fixture.custom', () => {
                window.__customModuleBoots += 1
            })
        </script>
        <script src="/public/default/profiles/development/js/shared/modules.js"></script>
    </body>
</html>
