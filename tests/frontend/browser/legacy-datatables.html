<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="csrf-token" content="browser-fixture-token" />
        <title>Legacy DataTables browser fixture</title>
        <style>
            body {
                font-family: sans-serif;
            }

            .fixture-row {
                outline: 1px solid currentColor;
            }
        </style>
        <script>
            const fixtureConfig = new URLSearchParams(window.location.search)
            const stateDatatables = fixtureConfig.get('state_datatables') !== 'false'

            window.GlobalConfig = {
                debug: true,
                env: 'testing',
                locale: 'en',
                url: 'http://127.0.0.1:4173',
                url_path: 'legacy-datatables',
                url_prefix: 'admin',
                template: { asset_dir: 'default' },
                user_id: null,
                max_file_size: 1,
                datetime_format: 'DD.MM.YYYY HH:mm',
                date_format: 'DD.MM.YYYY',
                state_datatables: stateDatatables,
                datatables_highlight: fixtureConfig.get('highlight') === 'true',
                state_tabs: false,
                state_filters: stateDatatables && fixtureConfig.get('state_filters') !== 'false',
                wysiwyg: {},
                lang: {
                    button: { cancel: 'Cancel', yes: 'Yes' },
                    select: { no_items: 'No items', nothing: 'Nothing selected' },
                    table: {
                        action_confirm: 'Confirm action',
                        error: 'Table error',
                        no_action: 'No action',
                    },
                },
            }
        </script>
    </head>
    <body>
        <aside class="card" hidden>
            <form data-type="display-actions">
                <select class="sleepingOwlActionsStore" id="sleepingOwlActionsStore">
                    <option value="0" selected>Decoy action</option>
                </select>
            </form>
        </aside>

        <main class="card">
            <form data-type="display-actions" id="bulk-action-form">
                <select class="sleepingOwlActionsStore" id="bulk-action-select">
                    <option value="0">No action</option>
                    <option value="/api/action" data-method="POST" selected>Archive</option>
                </select>
                <button type="submit" id="bulk-action-submit">Apply</button>
            </form>

            <div class="display-actions-form-wrapper">
                <form action="/api/action-form" method="POST" data-confirm="false">
                    <input name="reason" value="fixture" />
                    <button type="submit" id="custom-action-submit">Custom action</button>
                </form>
            </div>

            <div
                class="display-filters"
                data-display="DisplayDatatablesAsync"
                data-datatables-id="legacy-table-fixture"
            >
                <div data-index="0">
                    <div class="column-filter" data-type="control">
                        <button id="filters-exec" type="button">Filter</button>
                        <button id="filters-cancel" type="button">Clear</button>
                    </div>
                </div>
                <div data-index="1">
                    <input id="text-filter" class="column-filter" data-type="text" />
                </div>
                <div data-index="2">
                    <div class="input-date">
                        <input id="date-filter" class="column-filter" data-type="date" />
                    </div>
                </div>
                <div data-index="3">
                    <div id="range-filter" class="column-filter" data-type="range">
                        <input id="range-from" class="form-control column-filter" />
                        <input id="range-to" class="form-control column-filter" />
                    </div>
                </div>
                <div data-index="4">
                    <select id="select-filter" class="column-filter" data-type="select" multiple>
                        <option value="active">Active</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>
                <div data-index="5">
                    <input id="daterange-filter" class="column-filter" data-type="daterange" />
                </div>
            </div>

            <table
                id="legacy-table"
                class="datatables autorefresh lightcolumn"
                data-id="legacy-table-fixture"
                data-url="/api/datatables"
                data-method="POST"
                data-payload='{"fixture":"legacy"}'
                data-display-search="1"
                data-display-dtlength="1"
                data-attributes='{"autoWidth":false,"columns":[{"orderable":false},{"orderable":true},{"orderable":true},{"orderable":true},{"orderable":true},{"orderable":false},{"orderable":false}],"order":[[1,"asc"]],"pageLength":2,"responsive":false,"searchDelay":0}'
            >
                <thead>
                    <tr>
                        <th>Select</th>
                        <th>Name</th>
                        <th>Created</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Window</th>
                        <th>Preview</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </main>

        <section id="secondary-fixture" class="card">
            <div
                class="display-filters"
                data-display="DisplayDatatablesAsync"
                data-datatables-id="secondary-table-fixture"
            >
                <div data-index="0">
                    <div class="column-filter" data-type="control">
                        <button id="filters-exec" type="button">Filter secondary</button>
                        <button id="filters-cancel" type="button">Clear secondary</button>
                    </div>
                </div>
                <div data-index="1">
                    <input id="secondary-text-filter" class="column-filter" data-type="text" />
                </div>
            </div>

            <table
                id="secondary-table"
                class="datatables"
                data-id="secondary-table-fixture"
                data-url="/api/datatables"
                data-method="POST"
                data-payload='{"fixture":"secondary"}'
                data-display-search="0"
                data-display-dtlength="0"
                data-attributes='{"autoWidth":false,"columns":[{"orderable":false},{"orderable":true},{"orderable":true},{"orderable":true},{"orderable":true},{"orderable":false},{"orderable":false}],"order":[[1,"asc"]],"pageLength":2,"responsive":false,"searchDelay":0}'
            >
                <thead>
                    <tr>
                        <th>Select</th>
                        <th>Name</th>
                        <th>Created</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Window</th>
                        <th>Preview</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section id="sync-fixture" class="card">
            <h2>Server-rendered table</h2>
            <table
                id="sync-table"
                class="datatables"
                data-id="sync-table-fixture"
                data-display-search="1"
                data-display-dtlength="1"
                data-attributes='{"autoWidth":false,"order":[[1,"desc"]],"pageLength":10,"responsive":false}'
            >
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Rank</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Beta</td>
                        <td>2</td>
                    </tr>
                    <tr>
                        <td>Alpha</td>
                        <td>1</td>
                    </tr>
                    <tr>
                        <td>Gamma</td>
                        <td>3</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section id="tab-fixture" class="card">
            <button id="tab-trigger" type="button" aria-controls="tab-panel">Show table tab</button>
            <div id="tab-panel" hidden>
                <table
                    id="tab-table"
                    class="datatables"
                    data-id="tab-table-fixture"
                    data-display-search="1"
                    data-display-dtlength="1"
                    data-attributes='{"autoWidth":true,"order":[[0,"asc"]],"pageLength":10,"responsive":false}'
                >
                    <thead>
                        <tr>
                            <th>Project</th>
                            <th>Owner</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Aurora administration workspace</td>
                            <td>Alice</td>
                        </tr>
                        <tr>
                            <td>Borealis reporting workspace</td>
                            <td>Bob</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <script>
            const fixtureFeatures = new URLSearchParams(window.location.search)

            if (!fixtureFeatures.has('multiple')) {
                document.querySelector('#secondary-fixture').remove()
            }
            if (!fixtureFeatures.has('sync')) {
                document.querySelector('#sync-fixture').remove()
            }
            if (!fixtureFeatures.has('tab')) {
                document.querySelector('#tab-fixture').remove()
            } else {
                document.querySelector('#tab-trigger').addEventListener('click', () => {
                    document.querySelector('#tab-panel').hidden = false
                })
            }
        </script>

        <script src="/public/default/js/admin-app.js"></script>
        <script>
            window.__legacyEvents = []
            window.__swalCalls = []

            ;[
                'datatables::draw',
                'datatables::actions::submitting',
                'datatables::actions::submitted',
                'datatables::actions::cancel',
            ].forEach((eventName) => {
                Admin.Events.on(eventName, () => window.__legacyEvents.push(eventName))
            })

            Admin.Messages.confirm = () => Promise.resolve({ value: true })
            Swal.fire = (settings) => {
                window.__swalCalls.push(settings)
                return Promise.resolve({ value: true })
            }
        </script>
        <script src="/public/default/js/modules.js"></script>
        <span
            id="autoupdate-fixture"
            data-admin-table-autoupdate
            data-close-label="Stop auto-update"
            data-interval="250"
            data-table-class="autorefresh"
            style="--soa-datatables-autoupdate-color: currentColor"
            hidden
        ></span>
        <script>
            if (!new URLSearchParams(window.location.search).has('autoupdate')) {
                document.querySelector('#autoupdate-fixture').remove()
            }
        </script>
    </body>
</html>
