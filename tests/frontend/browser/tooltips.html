<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="csrf-token" content="tooltips-token" />
        <link rel="stylesheet" href="/public/default/css/features/tooltip.css" />
    </head>
    <body>
        <main style="padding: 5rem">
            <button id="native-tooltip" data-toggle="tooltip" title="Native tooltip">Native</button>
            <button id="focus-tooltip" data-toggle="tooltip" data-original-title="Keyboard tooltip">
                Keyboard
            </button>
        </main>
        <template data-tooltip-template>
            <aside class="project-tooltip-shell" data-tooltip-popup role="tooltip">
                <span class="project-tooltip-nesting">
                    <strong data-tooltip-content></strong>
                </span>
            </aside>
        </template>
        <script src="/public/default/js/admin-core.js"></script>
        <script src="/public/default/js/features/tooltip.js"></script>
    </body>
</html>
