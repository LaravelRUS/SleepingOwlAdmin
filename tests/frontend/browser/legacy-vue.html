            <script id="related-fixture-props" type="application/json"></script>
            <script>
                const imageProps = {
                    assetPrefix: '',
                    csrfToken: 'fixture-token',
                    labels: {
                        browse: 'Upload image',
                        download: 'Download',
                        insertLink: 'Insert link',
                        remove: 'Remove image',
                    },
                    maxFileSize: 2,
                    messages: {
                        confirmRemove: 'Remove image?',
                        fileTooBig: 'File is too large',
                        invalidFileType: 'Wrong image type',
                        responseError: 'Upload error',
                    },
                    onlyLink: false,
                    readonly: true,
                    url: '/api/upload',
                }
                const existingImageProps = JSON.stringify({
                    ...imageProps,
                    name: 'items[42][image]',
                    value: 'fixtures/pixel.svg',
                })
                const newImageProps = JSON.stringify({
                    ...imageProps,
                    name: 'image',
                    value: 'fixtures/second.svg',
                })
                const existingGroupHtml = `
                    <div class="existing-related-group" data-lifecycle-fixture id="existing-related-group">
                        <input id="related-name" name="items[42][name]" />
                        <div
                            id="nested-image-wrapper"
                            v-pre
                            data-vue-app
                            data-vue-component="element-image"
                            data-vue-props='${existingImageProps}'
                        ></div>
                        <button id="remove-existing-group" type="button" data-related-remove>
                            Remove existing
                        </button>
                    </div>
                `
                const newGroupHtml = `
                    <div
                        class="new-related-group"
                        data-lifecycle-fixture
                        data-lifecycle-name="new-related-group"
                    >
                        <input id="related-title" name="title" />
                        <span class="raw-related-template-probe" v-if="false">Server HTML stays inert</span>
                        <script id="dynamic-image-props" type="application/json">${newImageProps}<\/script>
                        <div
                            class="dynamic-nested-image"
                            v-pre
                            data-vue-app
                            data-vue-component="element-image"
                            data-vue-props-id="dynamic-image-props"
                        ></div>
                        <select id="related-status" name="status" class="input-select">
                            <option value="draft">Draft</option>
                            <option value="ready">Ready</option>
                        </select>
                        <button class="remove-new-group" type="button" data-related-remove>
                            Remove new
                        </button>
                    </div>
                `
                document.querySelector('#related-fixture-props').textContent = JSON.stringify({
                    classes: {
                        actions: 'project-related-actions',
                        add: 'project-related-add',
                        addIcon: 'project-related-icon',
                        groups: 'project-related-groups',
                        root: 'project-related-root',
                    },
                    draggable: false,
                    groups: [
                        {
                            html: existingGroupHtml,
                            index: 0,
                            primary: '42',
                        },
                    ],
                    labels: { add: 'Add related' },
                    limit: 3,
                    name: 'items',
                    readonly: false,
                    removed: [],
                    stubHtml: newGroupHtml,
                })
            </script>
            <section
                id="related-fixture"
                v-pre
                data-vue-app
                data-vue-component="related-elements"
                data-vue-props-id="related-fixture-props"
            ></section>

        <script src="/public/default/js/admin-app-dev.js"></script>
        <script>
            window.__clipboardValue = 'fixtures/linked.svg'
            window.__componentDestroys = []
            window.__componentMounts = []
            window.__moduleCalls = []
            window.__selectChanges = []
            window.__toasts = []

            document.addEventListener('change', (event) => {
                if (!event.target.matches('[data-select-native]')) return

                const values = event.target.multiple
                    ? Array.from(event.target.selectedOptions, (option) => option.value)
                    : [event.target.value]
                window.__selectChanges.push({ id: event.target.id, values })
            })

            Admin.Components.register({
                name: 'fixture.related',
                selector: '[data-lifecycle-fixture]',
                mount(element) {
                    const mountedId = element.dataset.lifecycleName
                        ? `${element.dataset.lifecycleName}-${element.dataset.relatedIndex}`
                        : element.id
                    window.__componentMounts.push(mountedId)
                    element.dataset.lifecycleMounted = 'true'

                    return () => {
                        window.__componentDestroys.push(mountedId)
                        delete element.dataset.lifecycleMounted
                    }
                },
            })

            const originalModuleCall = Admin.Modules.call.bind(Admin.Modules)
            Admin.Modules.call = (name) => {
                window.__moduleCalls.push(name)
                return originalModuleCall(name)
            }
            Admin.Messages.confirm = () => Promise.resolve({ value: true })
            Admin.Messages.cliptobuffer = () => Promise.resolve({ value: window.__clipboardValue })
            Swal.mixin = () => ({
                fire: ({ title }) => {
                    window.__toasts.push(title)
                    return Promise.resolve()
                },
            })
        </script>
        <script src="/public/default/js/vue-dev.js"></script>
        <script src="/public/default/js/modules.js"></script>
        <script>
            document.documentElement.dataset.ready = 'true'
        </script>
