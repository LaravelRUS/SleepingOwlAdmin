<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="csrf-token" content="dropdown-token" />
        <title>Dropdown browser fixture</title>
        <link rel="stylesheet" href="/public/default/css/admin-app.css" />
        <script>
            window.GlobalConfig = {
                debug: true,
                env: 'testing',
                locale: 'en',
                url: 'http://127.0.0.1:4173',
                url_path: 'dropdowns',
                url_prefix: 'admin',
                template: { asset_dir: 'default' },
                user_id: null,
                state_datatables: false,
                datatables_highlight: false,
                state_tabs: false,
                state_filters: false,
                wysiwyg: {},
                lang: {
                    button: { cancel: 'Cancel', save: 'Save', yes: 'Yes' },
                    select: { no_items: 'No items', nothing: 'Nothing selected' },
                    table: { error: 'Request failed', no_action: 'No action' },
                },
            }
        </script>
    </head>
    <body>
        <main>
            <div id="native-root" class="btn-group">
                <button
                    id="native-toggle"
                    type="button"
                    class="btn dropdown-toggle"
                    data-toggle="dropdown"
                    aria-controls="native-menu"
                    aria-expanded="false"
                >
                    Actions
                </button>
                <div id="native-menu" class="dropdown-menu">
                    <a id="first-action" href="#first" class="dropdown-item">First action</a>
                    <button id="second-action" type="button" class="dropdown-item">
                        Second action
                    </button>
                    <button id="disabled-action" type="button" disabled>Disabled action</button>
                    <label for="menu-filter">Filter</label>
                    <input id="menu-filter" />
                </div>
            </div>

            <div id="legacy-root" class="dropdown">
                <button
                    id="legacy-toggle"
                    type="button"
                    data-toggle="dropdown"
                    aria-controls="legacy-menu"
                    aria-expanded="false"
                >
                    Legacy actions
                </button>
                <div id="legacy-menu" class="dropdown-menu">
                    <a id="legacy-action" href="#legacy" class="dropdown-item">Legacy action</a>
                </div>
            </div>

            <button id="outside" type="button">Outside</button>
            <div id="dynamic-host"></div>
        </main>

        <script src="/public/default/js/admin-app.js"></script>
        <script>
            window.__dropdownEvents = []
            ;['dropdown:show', 'dropdown:shown', 'dropdown:hide', 'dropdown:hidden'].forEach(
                (name) => {
                    document.addEventListener(name, (event) => {
                        window.__dropdownEvents.push({ id: event.target.id, name })
                    })
                },
            )
        </script>
        <script src="/public/default/js/modules.js"></script>
    </body>
</html>
