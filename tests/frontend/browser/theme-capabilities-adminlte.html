<!doctype html>
<html lang="en" data-theme="adminlte">
    <head>
        <meta charset="UTF-8" />
        <meta name="csrf-token" content="theme-capabilities-token" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>AdminLTE theme capability fixture</title>
        <script>
            window.GlobalConfig = {
                datatables_settings: { state_datatables: false, state_filters: false },
                debug: true,
                env: 'testing',
                lang: {
                    button: { cancel: 'Cancel', save: 'Save', yes: 'Yes' },
                    file: { insert_link: 'Insert link' },
                    select: { no_items: 'No items', nothing: 'Nothing selected' },
                    table: {
                        'delete-confirm': 'Delete?',
                        'destroy-confirm': 'Destroy?',
                        error: 'Table error',
                        'no-action': 'No action',
                    },
                },
                locale: 'en',
                state_tabs: false,
                template: { asset_dir: 'default' },
                url: 'http://127.0.0.1:4173',
                url_path: 'theme-capabilities-adminlte',
                url_prefix: 'admin',
                user_id: null,
                wysiwyg: {},
            }
        </script>
        <link rel="stylesheet" href="/public/default/profiles/development/css/admin-core.css" />
        <link rel="stylesheet" href="/public/default/profiles/development/css/icons.css" />
        <link rel="stylesheet" href="/public/default/profiles/development/css/shared/ui.css" />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/shared/features.css"
        />
        <link
            rel="stylesheet"
            href="/public/default/profiles/development/css/themes/adminlte.css"
        />
    </head>
    <body class="sidebar-mini">
        <div class="wrapper">
            <aside class="main-sidebar">
                <ul class="nav nav-sidebar" data-widget="treeview">
                    <li class="nav-item">
                        <a class="nav-link" href="#capability-child" id="capability-branch"
                            >Capabilities</a
                        >
                        <ul class="nav nav-treeview" id="capability-tree">
                            <li class="nav-item">
                                <a class="nav-link" href="#capability-table">Table</a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </aside>
            <div id="sidebar-overlay" hidden></div>

            <main class="content-wrapper p-3">
                <h1>AdminLTE capability baseline</h1>

                <button
                    class="btn btn-primary"
                    data-widget="pushmenu"
                    id="capability-sidebar"
                    type="button"
                >
                    Toggle navigation
                </button>
                <section class="card card-body">
                    <div class="dropdown">
                        <button
                            class="btn btn-primary"
                            data-toggle="dropdown"
                            id="capability-dropdown"
                            type="button"
                        >
                            Actions
                        </button>
                        <div class="dropdown-menu">
                            <button class="dropdown-item" type="button">Archive</button>
                        </div>
                    </div>

                    <button
                        class="btn btn-info"
                        data-toggle="tooltip"
                        id="capability-tooltip"
                        title="Theme help"
                        type="button"
                    >
                        Help
                    </button>

                    <div class="nav nav-tabs" data-tablist>
                        <button
                            class="nav-link active"
                            data-tab
                            id="capability-first-tab"
                            aria-controls="capability-first-panel"
                        >
                            Overview
                        </button>
                        <button
                            class="nav-link"
                            data-tab
                            id="capability-second-tab"
                            aria-controls="capability-second-panel"
                        >
                            Details
                        </button>
                    </div>
                    <section id="capability-first-panel">Overview panel</section>
                    <section id="capability-second-panel">Details panel</section>

                    <table
                        class="table datatables"
                        data-attributes='{"order":[],"paging":false,"searching":false}'
                        data-id="capability-table"
                        id="capability-table"
                    >
                        <thead>
                            <tr>
                                <th>Name</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Shared row</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="alert alert-success show" id="capability-alert">
                        Saved
                        <button
                            class="close"
                            data-dismiss="alert"
                            id="capability-alert-close"
                            type="button"
                        >
                            Close
                        </button>
                    </div>
                </section>
            </main>
        </div>

        <template data-tooltip-template>
            <div class="tooltip" data-tooltip-popup role="tooltip">
                <span class="tooltip-inner" data-tooltip-content></span>
            </div>
        </template>

        <script src="/public/default/profiles/development/js/admin-core.js"></script>
        <script src="/public/default/profiles/development/js/shared/compatibility.js"></script>
        <script src="/public/default/profiles/development/js/shared/vue.js"></script>
        <script src="/public/default/profiles/development/js/themes/adminlte.js"></script>
        <script src="/public/default/profiles/development/js/shared/features.js"></script>
        <script src="/public/default/profiles/development/js/shared/modules.js"></script>
    </body>
</html>
